<header class="bg-white/80 dark:bg-[#0A0A0A]/80 backdrop-blur-xl sticky top-0 z-50 border-b border-[#E7E5E1] dark:border-[#262626] transition-colors">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center h-16 sm:h-18">
            <!-- Brand Logo -->
            <div class="flex items-center space-x-3">
                <a href="{% url 'home' %}" class="flex items-center space-x-2.5 group">
                    <div class="w-9 h-9 rounded-xl bg-[#0A0A0A] dark:bg-[#F5F1E8] text-white dark:text-[#0A0A0A] flex items-center justify-center font-black text-sm shadow-xs transition-transform duration-200 group-hover:scale-105">
                        <i class="fa-solid fa-cube text-xs"></i>
                    </div>
                    <span class="text-lg font-bold text-slate-900 dark:text-[#F5F1E8] tracking-tight">Lumos<span class="text-xs ml-1 font-mono text-slate-400 font-normal">B2B</span></span>
                </a>
            </div>

            <!-- Navigation Links / Actions -->
            <div class="flex items-center space-x-2 sm:space-x-3">
                {% if user.is_authenticated %}
                    <a href="{% url 'businesses:dashboard' %}" class="inline-flex items-center px-3.5 py-2 text-xs font-semibold rounded-lg text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-[#1E1E1E] transition">
                        <i class="fa-solid fa-chart-pie mr-1.5 opacity-70"></i> Dashboard
                    </a>
                    
                    <a href="{% url 'chatbot:inbox' %}" class="inline-flex items-center px-3.5 py-2 text-xs font-semibold rounded-lg text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-[#1E1E1E] transition">
                        <i class="fa-solid fa-inbox mr-1.5 opacity-70"></i> Murojaatlar
                    </a>

                    <a href="{% url 'team:team_list' %}" class="inline-flex items-center px-3.5 py-2 text-xs font-semibold rounded-lg text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-[#1E1E1E] transition">
                        <i class="fa-solid fa-users mr-1.5 opacity-70"></i> Jamoa
                    </a>

                    <a href="{% url 'businesses:analytics' %}" class="inline-flex items-center px-3.5 py-2 text-xs font-semibold rounded-lg text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-[#1E1E1E] transition">
                        <i class="fa-solid fa-chart-line mr-1.5 opacity-70"></i> Analitika
                    </a>
                    
                    <!-- Dark Mode Toggle Button -->
                    <button type="button" 
                            id="themeToggleBtn"
                            onclick="toggleDarkMode()" 
                            class="w-8 h-8 rounded-lg flex items-center justify-center text-slate-500 hover:text-slate-900 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-[#1E1E1E] transition" 
                            title="Mavzuni o'zgartirish">
                        <i id="themeToggleIcon" class="fa-solid fa-moon text-xs"></i>
                    </button>

                    <div class="hidden md:flex items-center space-x-2 text-xs text-slate-500 pl-2 border-l border-[#E7E5E1] dark:border-[#262626]">
                        <div class="w-7 h-7 rounded-full bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900 flex items-center justify-center font-bold text-[10px]">
                            {{ user.first_name|first|default:user.username|first|upper }}
                        </div>
                        <span class="font-medium text-slate-700 dark:text-slate-300">{{ user.first_name|default:user.username }}</span>
                    </div>

                    <a href="{% url 'accounts:logout' %}" class="inline-flex items-center px-3 py-1.5 text-xs font-medium rounded-lg text-slate-500 hover:text-rose-600 hover:bg-rose-50 dark:hover:bg-rose-950/30 transition" title="Chiqish">
                        <i class="fa-solid fa-arrow-right-from-bracket mr-1"></i> Chiqish
                    </a>
                {% else %}
                    <!-- Dark Mode Toggle Button for guests -->
                    <button type="button" 
                            id="themeToggleBtnGuest"
                            onclick="toggleDarkMode()" 
                            class="w-8 h-8 rounded-lg flex items-center justify-center text-slate-500 hover:text-slate-900 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-[#1E1E1E] transition" 
                            title="Mavzuni o'zgartirish">
                        <i class="fa-solid fa-moon text-xs"></i>
                    </button>

                    <a href="{% url 'accounts:login' %}" class="text-xs font-semibold text-slate-700 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white px-3 py-2 transition">
                        Kirish
                    </a>
                    <a href="{% url 'accounts:register' %}" class="inline-flex items-center justify-center px-4 py-2 text-xs font-bold text-white bg-[#0A0A0A] hover:bg-[#18181B] dark:bg-[#F5F1E8] dark:text-[#0A0A0A] dark:hover:bg-white rounded-full shadow-xs transition">
                        Boshlash <i class="fa-solid fa-arrow-right ml-1.5 text-[10px]"></i>
                    </a>
                {% endif %}
            </div>
        </div>
    </div>
</header>

<script>
    function updateThemeIcons() {
        var isDark = document.documentElement.classList.contains('dark');
        var icons = document.querySelectorAll('#themeToggleIcon, #themeToggleBtnGuest i');
        icons.forEach(function(icon) {
            if (isDark) {
                icon.className = 'fa-solid fa-sun text-amber-400 text-base';
            } else {
                icon.className = 'fa-solid fa-moon text-slate-500 text-base';
            }
        });
    }

    function toggleDarkMode() {
        if (document.documentElement.classList.contains('dark')) {
            document.documentElement.classList.remove('dark');
            localStorage.setItem('lumos_theme', 'light');
        } else {
            document.documentElement.classList.add('dark');
            localStorage.setItem('lumos_theme', 'dark');
        }
        updateThemeIcons();
    }

    // Set initial icon on load
    document.addEventListener('DOMContentLoaded', updateThemeIcons);
</script>
