<!-- Slim Mobile Header (Only visible on screens smaller than lg) -->
<header class="lg:hidden sticky top-0 z-20 bg-white/90 dark:bg-[#0E0E0E]/90 backdrop-blur-md border-b border-[#EAE8E4] dark:border-[#222222] px-4 py-2.5 flex items-center justify-between transition-colors select-none">
    <div class="flex items-center space-x-3">
        <!-- Hamburger Menu Button -->
        <button type="button" 
                onclick="toggleMobileSidebar()" 
                class="w-9 h-9 rounded-xl border border-[#EAE8E4] dark:border-[#222222] flex items-center justify-center text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-[#1A1A1A] transition"
                aria-label="Menyuni ochish">
            <i class="fa-solid fa-bars text-sm"></i>
        </button>

        <!-- Brand Logo (without B2B) -->
        <a href="{% url 'businesses:dashboard' %}" class="flex items-center space-x-2 group">
            <div class="w-7 h-7 rounded-lg bg-[#0A0A0A] dark:bg-[#F5F1E8] text-white dark:text-[#0A0A0A] flex items-center justify-center font-black text-xs shadow-xs">
                <i class="fa-solid fa-cube text-[10px]"></i>
            </div>
            <span class="font-bold text-sm text-slate-900 dark:text-[#F5F1E8] tracking-tight">Lumos</span>
        </a>
    </div>

    <!-- Mobile Top Right Actions -->
    <div class="flex items-center space-x-2">
        <!-- Theme Toggle -->
        <button type="button" 
                onclick="toggleDarkMode()" 
                class="w-8 h-8 rounded-lg flex items-center justify-center text-slate-500 hover:text-slate-900 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-[#1A1A1A] transition"
                title="Mavzuni o'zgartirish">
            <i class="themeToggleIcon fa-solid fa-moon text-xs"></i>
        </button>

        <!-- User Avatar -->
        <div class="w-8 h-8 rounded-full bg-[#0A0A0A] dark:bg-[#F5F1E8] text-white dark:text-[#0A0A0A] flex items-center justify-center font-bold text-xs shrink-0 shadow-2xs">
            {{ user.first_name|first|default:user.username|first|upper }}
        </div>
    </div>
</header>
